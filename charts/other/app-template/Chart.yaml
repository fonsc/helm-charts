name: app-template
version: 3.6.1
kubeVersion: ">=1.22.0-0"
maintainers:
  - name: fonsc
    email: me@fonsc.dev
dependencies:
  - name: common
    repository: https://fonsc.github.io/helm-charts
    version: 3.6.1
annotations:
  artifacthub.io/changes: |-
    - kind: changed
      description: |
        Updated library version to 3.6.1.
      links:
        - name: Upgrade instructions from v2.x
          url: https://fonsc.github.io/helm-charts/docs/app-template/#from-2xx-to-30x
        - name: Common library chart definition
          url: https://github.com/fonsc/helm-charts/blob/main/charts/library/common/Chart.yaml
